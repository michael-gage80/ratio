name: Firebase

# Runs the Firestore security-rules tests against the emulator on every PR and push,
# and deploys rules/indexes (plus Functions, once functions/ exists) on merge to main.
#
# Deploying needs a repo secret FIREBASE_SERVICE_ACCOUNT: a JSON key for a service
# account in ratio-91a04 with the Firebase Admin role. Until it's added, the deploy
# job skips with a warning instead of failing.

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "firestore-tests/**"
      - "functions/**"
      - ".github/workflows/firebase.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "firestore-tests/**"
      - "functions/**"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install -g firebase-tools
      - run: npm ci --prefix firestore-tests
      - name: Security rules tests
        run: firebase emulators:exec --only firestore --project demo-ratio "npm --prefix firestore-tests test"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g firebase-tools
      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT isn't set — skipping deploy."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          targets="firestore"
          if [ -f functions/package.json ]; then
            npm ci --prefix functions && npm run build --prefix functions
            targets="$targets,functions"
          fi
          firebase deploy --project ratio-91a04 --only "$targets" --non-interactive
