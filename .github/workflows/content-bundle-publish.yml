name: Content bundle publish

# On merge to main, publishes one versioned bundle per module to Cloud Storage so
# content fixes reach students without an App Store release. Skips with a warning
# until the FIREBASE_SERVICE_ACCOUNT secret exists.

on:
  push:
    branches: [main]
    paths:
      - "ratio/Resources/Content/lessons/**"
      - "content-tools/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix content-tools
      - run: node content-tools/validate.mjs
      - name: Publish bundles
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # No lessons are reviewed yet; drop this once lawyer sign-off is in place.
          INCLUDE_UNREVIEWED: "1"
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT isn't set — skipping publish; the app uses its bundled lessons."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node content-tools/publish.mjs
