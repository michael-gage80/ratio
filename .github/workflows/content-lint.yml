name: Content lint

# Validates every lesson and the diagnostic bank (schema, answers that point at real
# options, spans present in their scenarios, all three skills in each test pool,
# reading time). Errors fail the check; warnings are listed for the content team.

on:
  pull_request:
    paths:
      - "ratio/Resources/Content/**"
      - "content-tools/**"
      - ".github/workflows/content-lint.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix content-tools
      - run: node content-tools/validate.mjs
